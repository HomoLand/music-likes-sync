name: Bug report
description: Report a reproducible problem without sharing private account data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste cookies, `.env` values, raw `data/` files, generated reports, or full provider responses from a real account.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Apple import
        - QQ Music provider
        - NetEase provider
        - Mirror plan
        - Add resolution
        - Deletion confirmation
        - Web UI
        - CLI
        - Docker or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using redacted or sample data.
      placeholder: |
        1. Run ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste summarized, redacted output from relevant commands.
      placeholder: |
        npm run verify
        npm run check:state
        npm run smoke:http
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: I removed cookies, tokens, auth headers, account IDs, playlist IDs, and private library data.
          required: true
        - label: I did not attach raw files from `data/`, `reports/`, browser profiles, or `.env`.
          required: true
